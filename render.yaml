services:
  - type: web
    name: toysrus-monopoly
    runtime: node
    repo: https://github.com/IrisRannn/toysrus-monopoly
    branch: main
    region: oregon
    plan: 4c-8g
    numInstances: 1
    buildCommand: npm install && npm run build
    startCommand: yarn start
    autoDeployTrigger: commit
    disk:
      name: game-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
